name: Build and Push Multi-Platform Images

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: agones-
  IMAGE_OWNER: pubg

# TODO: support windows
jobs:
  build-linux:
    name: Build Linux images (amd64, arm64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: allocator
            dockerfile: cmd/allocator/Dockerfile
            context: .
          - name: controller
            dockerfile: cmd/controller/Dockerfile
            context: .
          - name: extensions
            dockerfile: cmd/extensions/Dockerfile
            context: .
          - name: sdk-server
            dockerfile: cmd/sdk-server/Dockerfile
            context: .
          - name: ping
            dockerfile: cmd/ping/Dockerfile
            context: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          IMAGE_BASE=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_PREFIX }}${{ matrix.service.name }}
          SAFE_REF="${{ github.ref_name }}"
          SAFE_REF=${SAFE_REF////-}
          SHORT_SHA=${GITHUB_SHA::7}
          BRANCH_LATEST_TAG=${IMAGE_BASE}:${SAFE_REF}-latest
          BRANCH_LATEST_LINUX_TAG=${IMAGE_BASE}:${SAFE_REF}-latest-linux
          BRANCH_SHA_TAG=${IMAGE_BASE}:${SAFE_REF}-${SHORT_SHA}
          BRANCH_SHA_LINUX_TAG=${IMAGE_BASE}:${SAFE_REF}-${SHORT_SHA}-linux
          echo "image_base=${IMAGE_BASE}" >> $GITHUB_OUTPUT
          echo "branch_latest_tag=${BRANCH_LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "linux_latest_tag=${BRANCH_LATEST_LINUX_TAG}" >> $GITHUB_OUTPUT
          echo "branch_sha_tag=${BRANCH_SHA_TAG}" >> $GITHUB_OUTPUT
          echo "linux_sha_tag=${BRANCH_SHA_LINUX_TAG}" >> $GITHUB_OUTPUT
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "latest_tag=${IMAGE_BASE}:latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push (linux/amd64, linux/arm64)
        id: build_linux
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.linux_latest_tag }}
            ${{ steps.tags.outputs.linux_sha_tag }}
          provenance: false

      - name: Export linux digest
        id: linux_digest
        run: |
          echo "digest=${{ steps.build_linux.outputs.digest }}" >> $GITHUB_OUTPUT

  create-manifests:
    name: Create multi-platform manifests
    runs-on: ubuntu-latest
    needs:
      - build-linux
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: allocator
          - name: controller
          - name: extensions
          - name: sdk-server
          - name: ping
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags
        id: tags
        run: |
          IMAGE_BASE=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_PREFIX }}${{ matrix.service.name }}
          SAFE_REF="${{ github.ref_name }}"
          SAFE_REF=${SAFE_REF////-}
          SHORT_SHA=${GITHUB_SHA::7}
          LINUX_LATEST_TAG=${IMAGE_BASE}:${SAFE_REF}-latest-linux
          COMBINED_LATEST_TAG=${IMAGE_BASE}:${SAFE_REF}-latest
          LINUX_SHA_TAG=${IMAGE_BASE}:${SAFE_REF}-${SHORT_SHA}-linux
            COMBINED_SHA_TAG=${IMAGE_BASE}:${SAFE_REF}-${SHORT_SHA}
          echo "image_base=${IMAGE_BASE}" >> $GITHUB_OUTPUT
          echo "linux_latest_tag=${LINUX_LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "combined_latest_tag=${COMBINED_LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "linux_sha_tag=${LINUX_SHA_TAG}" >> $GITHUB_OUTPUT
          echo "combined_sha_tag=${COMBINED_SHA_TAG}" >> $GITHUB_OUTPUT
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "latest_tag=${IMAGE_BASE}:latest" >> $GITHUB_OUTPUT
          fi

      - name: Create and push manifest (branch-latest)
        run: |
          docker buildx imagetools create \
            --tag ${{ steps.tags.outputs.combined_latest_tag }} \
            ${{ steps.tags.outputs.linux_latest_tag }}

      - name: Create and push manifest (branch-sha)
        run: |
          docker buildx imagetools create \
            --tag ${{ steps.tags.outputs.combined_sha_tag }} \
            ${{ steps.tags.outputs.linux_sha_tag }}

      - name: Create and push manifest (latest) [main only]
        if: github.ref_name == 'main'
        run: |
          docker buildx imagetools create \
            --tag ${{ steps.tags.outputs.latest_tag }} \
            ${{ steps.tags.outputs.linux_tag }}
