name: Build Allocator Image

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/pubg-devops/agones-allocator

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          sha="${GITHUB_SHA::7}"
          echo "latest=${IMAGE}:${ref}-latest" >> "$GITHUB_OUTPUT"
          echo "sha=${IMAGE}:${ref}-${sha}" >> "$GITHUB_OUTPUT"
          echo "version=${ref}-${sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/allocator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.latest }}
            ${{ steps.tags.outputs.sha }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          provenance: false
