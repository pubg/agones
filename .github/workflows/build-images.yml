name: Build and Push Multi-Platform Images

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: agones-
  IMAGE_OWNER: pubg

# TODO: support windows
jobs:
  build-linux:
    name: Build Linux images (amd64, arm64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: allocator
            dockerfile: cmd/allocator/Dockerfile
            context: .
          - name: controller
            dockerfile: cmd/controller/Dockerfile
            context: .
          - name: extensions
            dockerfile: cmd/extensions/Dockerfile
            context: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          IMAGE_BASE=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_PREFIX }}${{ matrix.service.name }}
          SHA_TAG=${IMAGE_BASE}:${{ github.sha }}
          LINUX_TAG=${IMAGE_BASE}:${{ github.sha }}-linux
          echo "image_base=${IMAGE_BASE}" >> $GITHUB_OUTPUT
          echo "sha_tag=${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "linux_tag=${LINUX_TAG}" >> $GITHUB_OUTPUT
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "latest_tag=${IMAGE_BASE}:latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push (linux/amd64, linux/arm64)
        id: build_linux
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.linux_tag }}
          provenance: false

      - name: Export linux digest
        id: linux_digest
        run: |
          echo "digest=${{ steps.build_linux.outputs.digest }}" >> $GITHUB_OUTPUT

  create-manifests:
    name: Create multi-platform manifests
    runs-on: ubuntu-latest
    needs:
      - build-linux
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: allocator
          - name: controller
          - name: extensions
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags
        id: tags
        run: |
          IMAGE_BASE=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_PREFIX }}${{ matrix.service.name }}
          LINUX_TAG=${IMAGE_BASE}:${{ github.sha }}-linux
          COMBINED_SHA_TAG=${IMAGE_BASE}:${{ github.sha }}
          echo "image_base=${IMAGE_BASE}" >> $GITHUB_OUTPUT
          echo "linux_tag=${LINUX_TAG}" >> $GITHUB_OUTPUT
          echo "combined_tag=${COMBINED_SHA_TAG}" >> $GITHUB_OUTPUT
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "latest_tag=${IMAGE_BASE}:latest" >> $GITHUB_OUTPUT
          fi

      - name: Create and push manifest (sha)
        run: |
          docker buildx imagetools create \
            --tag ${{ steps.tags.outputs.combined_tag }} \
            ${{ steps.tags.outputs.linux_tag }}

      - name: Create and push manifest (latest) [main only]
        if: github.ref_name == 'main'
        run: |
          docker buildx imagetools create \
            --tag ${{ steps.tags.outputs.latest_tag }} \
            ${{ steps.tags.outputs.linux_tag }}
